<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otonoha 音の葉 – Pemutar Musik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe3;--card:#fffaf1;--ink:#2d3250;--mut:#7b7a93;--sak:#e7a1b3;--beni:#c4506b;--ai:#2d3250;--mat:#7f9f73;--kin:#c9a227;--line:#e6dccb;--sh:0 6px 20px rgba(45,50,80,.1);--hd:'Shippori Mincho','Hiragino Mincho ProN',Georgia,serif;--bd:'Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171726;--card:#212236;--ink:#f3ecdf;--mut:#9d9bb8;--sak:#e7a1b3;--beni:#e57b96;--line:#34354e;--sh:0 6px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171726;--card:#212236;--ink:#f3ecdf;--mut:#9d9bb8;--beni:#e57b96;--line:#34354e;--sh:0 6px 20px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--bd);background-image:radial-gradient(circle at 50% 100%,transparent 58%,var(--line) 59%,var(--line) 61%,transparent 62%);background-size:44px 22px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--beni);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font:700 22px var(--hd);display:flex;align-items:center;gap:8px;margin-right:auto}.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--beni);color:#fff;font-size:18px}
.srch{flex:1 1 220px;max-width:420px;position:relative}.srch input{width:100%;padding:9px 14px 9px 36px;border-radius:99px;border:1px solid var(--line);background:var(--card)}.srch:before{content:"🔍";position:absolute;left:12px;top:8px;font-size:14px}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btn{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);transition:.2s}.btn:hover{border-color:var(--beni);transform:translateY(-1px)}
.btn.pri{background:var(--beni);color:#fff;border-color:var(--beni)}.btn.dng{color:var(--beni)}.btn.sm{padding:4px 10px;font-size:13px}
.app{display:grid;grid-template-columns:250px 1fr;gap:22px;padding:20px 18px 130px;max-width:1280px;margin:auto}
aside{align-self:start;position:sticky;top:76px;display:flex;flex-direction:column;gap:18px}
aside h4{margin:0 0 6px;font:700 15px var(--hd);color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:2px}.nav .it{display:flex;align-items:center;gap:4px;border-radius:10px;padding:2px 4px 2px 10px}
.nav .it>button.go{flex:1;text-align:left;padding:6px 0;display:flex;justify-content:space-between}.nav .it.on{background:var(--sak);color:#2d3250}.nav .it:hover:not(.on){background:var(--line)}
.nav .mini{opacity:.6;font-size:12px;padding:2px 5px}.nav .mini:hover{opacity:1}
.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{padding:2px 10px;border-radius:99px;background:var(--line);font-size:12.5px}.tag.on{background:var(--ai);color:#fff}
.data{display:flex;flex-wrap:wrap;gap:6px}
#sbtn{display:none}
main h1{font:700 26px var(--hd);margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px}
.bulk{position:sticky;top:72px;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;margin-bottom:12px;border-radius:14px;background:var(--ai);color:#fff;box-shadow:var(--sh);animation:pop .25s}
.bulk .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}.bulk select{color:#2d3250;background:#fffaf1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);transition:.2s}
.card.sel{outline:2px solid var(--beni)}.card.now{border-color:var(--beni)}.card.now .th:after{content:"♪ Diputar";position:absolute;left:8px;bottom:8px;background:var(--beni);color:#fff;padding:1px 9px;border-radius:99px;font-size:12px}
.th{position:relative;aspect-ratio:1;display:block;width:100%;cursor:pointer;overflow:hidden}.th img,.th .ph{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font:700 70px var(--hd);color:rgba(255,255,255,.9);transition:.4s}
.th:hover img,.th:hover .ph{transform:scale(1.06)}
.pb{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--beni);color:#fff;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s}.th:hover .pb,.card.now .pb{opacity:1;transform:none}.card.now .pb{display:none}
.chk{position:absolute;left:10px;top:10px;z-index:2;width:22px;height:22px;accent-color:var(--beni)}
.meta{padding:10px 12px 12px}.meta h3{margin:0;font:700 17px var(--hd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta p{margin:0 0 6px;color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:2px;margin-top:8px}.row .sp{flex:1}.star{color:var(--line);font-size:17px;padding:0 1px}.star.on{color:var(--kin)}.ic{padding:4px 7px;border-radius:8px}.ic:hover{background:var(--line)}.fav.on{color:var(--beni)}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.pg{display:flex;gap:4px;align-items:center}.pg button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card)}.pg button.on{background:var(--beni);color:#fff;border-color:var(--beni)}.pg button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}.empty b{display:block;font:700 54px var(--hd);color:var(--sak)}
/* ---------- Player ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,1.7fr) minmax(0,1fr);align-items:center;gap:20px;padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ai);color:#f6efe3;border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -8px 28px rgba(0,0,0,.2)}
.player :focus-visible,#focus :focus-visible{outline-color:var(--sak)}
.player .pi{display:flex;gap:12px;align-items:center;min-width:0;padding:4px 8px 4px 4px;margin:-4px;border-radius:14px;text-align:left;transition:background .2s}.player .pi:hover{background:rgba(255,255,255,.08)}
.player .pt{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}.player .pt>*{width:100%;height:100%;display:grid;place-items:center;object-fit:cover;font:700 22px var(--hd)}
.player .nm{min-width:0}.player .nm b,.player .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .nm b{font-size:15px}.player .nm span{font-size:12.5px;opacity:.7}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}.mid .seek{width:100%}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{color:#f6efe3;font-size:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .15s,transform .15s}.ctl button:hover{background:rgba(255,255,255,.12)}.ctl button:active{transform:scale(.9)}
.ctl .play{background:var(--sak);color:#2d3250;width:48px;height:48px;font-size:20px;margin:0 4px}.ctl .play:hover{background:#f0b4c4;transform:scale(1.06)}
.ctl .opt{font-size:17px;opacity:.55}.ctl .opt.on{opacity:1;color:var(--sak)}.ctl .opt sup{font-size:9px;font-weight:700}
.player.ld .play{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.55;transform:scale(.94)}}
.seek{display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}.seek span{min-width:38px;text-align:center;opacity:.75}.seek input{flex:1;min-width:0}
input[type=range].rg{-webkit-appearance:none;appearance:none;height:24px;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer;--p:0%;touch-action:none}
.rg:disabled{opacity:.4;cursor:default}
.rg::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--sak) var(--p),rgba(255,255,255,.22) var(--p))}
.rg::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.22)}.rg::-moz-range-progress{height:6px;border-radius:99px;background:var(--sak)}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45);transition:transform .15s}
.rg::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.rg:hover::-webkit-slider-thumb,.rg:active::-webkit-slider-thumb{transform:scale(1.3)}
.rt{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}.rt .vol{width:100px;flex:none}
.mb{width:36px;height:36px;border-radius:50%;font-size:17px;color:#f6efe3;display:grid;place-items:center}.mb:hover{background:rgba(255,255,255,.12)}
.player .fb{color:#f6efe3;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 14px;white-space:nowrap;transition:background .15s}.player .fb:hover{background:rgba(255,255,255,.12)}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(30,28,50,.55);backdrop-filter:blur(4px);animation:fade .2s}
.dlg{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.ov.out{opacity:0;transition:.2s}.ov.out .dlg{transform:scale(.92);transition:.2s}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.dh h2{margin:0;font:700 20px var(--hd)}.x{width:32px;height:32px;border-radius:50%}.x:hover{background:var(--line)}
.db{padding:16px 18px;display:flex;flex-direction:column;gap:12px}.db label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--mut)}.db input,.db select,.db textarea{color:var(--ink)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.act{display:flex;justify-content:flex-end;gap:8px}.help{border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--card) 70%,var(--line))}.help summary{cursor:pointer;padding:8px 12px;font-size:13.5px;color:var(--ink)}.help .hb{padding:0 12px 10px;font-size:13px;color:var(--mut);line-height:1.6}.help p{margin:6px 0}.help ul{margin:4px 0 0;padding-left:18px}.help li{margin-bottom:3px}.help code{background:var(--line);color:var(--ink);padding:1px 5px;border-radius:6px;font:12px monospace;word-break:break-all}
.db small{color:var(--mut)}.db textarea{min-height:140px;font:12px monospace}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(14px)}}@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center}.tst{background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;box-shadow:var(--sh);animation:pop .25s}
/* ---------- Vinil: dipakai tombol pintasan & mode fokus ---------- */
kbd{font:600 11px var(--bd);border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:1px 6px;margin:0 2px}
.rec{position:relative;display:block;width:100%;height:100%;padding:0;border-radius:50%;background:#0b0b12;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 10px 26px rgba(0,0,0,.45)}
.rec:after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:conic-gradient(from 35deg,transparent 0 6%,rgba(255,255,255,.2) 10%,transparent 16% 50%,rgba(255,255,255,.2) 60%,transparent 66%)}
.spin{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;will-change:transform;background:radial-gradient(circle closest-side,transparent 0 52%,rgba(255,255,255,.07) 52.5% 54%,transparent 54.5% 72%,rgba(255,255,255,.07) 72.5% 74%,transparent 74.5%),repeating-radial-gradient(circle closest-side,#0a0a10 0 1.5px,#1c1c27 1.5px 3px)}
.lbl{position:relative;width:var(--lbl);height:var(--lbl);border-radius:50%;overflow:hidden;box-shadow:0 0 0 calc(var(--lbl)*.09) hsl(var(--th,340) 50% 52%),0 0 0 calc(var(--lbl)*.1) rgba(0,0,0,.45)}
.lbl>*{width:100%;height:100%;display:grid;place-items:center;object-fit:cover;font:700 calc(var(--lbl)*.5) var(--hd);color:rgba(255,255,255,.92)}
.lbl:after{content:"";position:absolute;left:50%;top:50%;width:max(9%,3px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#10101a;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
/* ---------- Tombol pintasan mode fokus ---------- */
.fab{--lbl:24px;position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:31;width:64px;height:64px;padding:0;border-radius:50%;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.fab:hover{transform:scale(1.08)}.fab:active{transform:scale(.94)}.fab:focus-visible{outline-offset:9px}
.fab:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--sak) var(--pr,0%),color-mix(in srgb,var(--ink) 16%,transparent) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.fab .rec{transition:box-shadow .5s}.fab.on .rec{box-shadow:0 0 0 1px rgba(255,255,255,.14),0 8px 28px hsl(var(--th,340) 70% 55%/.6)}
.fab .tip{position:absolute;right:calc(100% + 16px);top:50%;transform:translate(6px,-50%);white-space:nowrap;background:var(--ai);color:#f6efe3;padding:5px 12px;border-radius:99px;font-size:13px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.18s}
.fab:hover .tip,.fab:focus-visible .tip{opacity:1;transform:translate(0,-50%)}
@media (max-width:860px){.fab{--lbl:21px;width:56px;height:56px;bottom:calc(122px + env(safe-area-inset-bottom,0px))}}
@media (hover:none){.fab .tip,#focus .keys{display:none}}
/* ---------- Mode fokus ---------- */
#focus{--deck:min(56vmin,40vh,380px);--lbl:calc(var(--deck)*.36);position:fixed;inset:0;z-index:40;display:none;overflow:auto;overscroll-behavior:contain;text-align:center;padding:20px;background:radial-gradient(circle at 50% 30%,hsl(var(--th,250) 28% 26%),#171726 72%);color:#f6efe3}
#focus.show{display:block;animation:fade .4s}#focus{-webkit-overflow-scrolling:touch;touch-action:pan-y}#focus.out{opacity:0;transition:opacity .2s}
#focus .fbg{position:fixed;inset:-10%;background:var(--art,none) center/cover;filter:blur(60px) saturate(1.4);opacity:.3;pointer-events:none}
#focus .fin{position:relative;z-index:1;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 0 12px;max-width:100%}
.fnow{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;height:100%;border-radius:2px;background:var(--sak);transform-origin:bottom;transform:scaleY(.3);animation:eq .9s ease-in-out infinite paused}
.eq i:nth-child(2){animation-duration:.7s;animation-delay:-.25s}.eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.5s}.eq i:nth-child(4){animation-duration:.8s;animation-delay:-.1s}
#focus.go .eq i{animation-play-state:running}@keyframes eq{50%{transform:scaleY(1)}}
.deck{position:relative;width:var(--deck);height:var(--deck);margin:8px calc(var(--deck)*.1) 8px 0}
.deck:before{content:"";position:absolute;inset:-4%;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
#focus.show .deck{animation:deckin .7s cubic-bezier(.2,1.2,.4,1)}@keyframes deckin{from{opacity:0;transform:scale(.75) rotate(-12deg)}}
#focus .vinyl{position:absolute;inset:0;cursor:pointer;transition:box-shadow .6s,transform .2s;box-shadow:0 0 0 4px #0a0a10,0 0 0 5px rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.55)}
#focus.go .vinyl{box-shadow:0 0 0 4px #0a0a10,0 0 0 5px rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.55),0 0 90px hsl(var(--th,340) 70% 60%/.38)}
#focus .vinyl:active{transform:scale(.985)}
.arm{position:absolute;left:101%;top:4%;width:4%;height:72%;border-radius:99px;transform-origin:50% 5.5%;transform:rotate(var(--arm,0deg));transition:transform .9s cubic-bezier(.35,.8,.25,1);background:linear-gradient(90deg,#8d8da6,#eeeef7 45%,#85859e);filter:drop-shadow(0 5px 5px rgba(0,0,0,.45));pointer-events:none}
.arm:before{content:"";position:absolute;left:50%;top:5.5%;width:380%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f4fb,#8c8ca6 60%,#55556c);box-shadow:0 0 0 3px rgba(0,0,0,.18)}
.arm:after{content:"";position:absolute;left:-50%;bottom:-3%;width:200%;height:11%;border-radius:4px 4px 7px 7px;background:linear-gradient(#e2e2ee,#8e8ea8);transform:rotate(-12deg);transform-origin:50% 0}
#focus h2{font:700 clamp(22px,6vw,32px) var(--hd);margin:4px 0 0;max-width:min(92vw,560px);line-height:1.25}#focus p{margin:0;opacity:.7}
.fmeta{display:flex;align-items:center;gap:2px;min-height:34px}.fmeta .ic{font-size:20px;border-radius:50%;padding:4px 8px}.fmeta .ic:hover{background:rgba(255,255,255,.1)}.fmeta .ffav.on{color:var(--sak)}.fmeta .star{color:rgba(255,255,255,.25);font-size:20px;padding:0 2px;transition:color .15s,transform .15s}.fmeta .star.on,.fmeta .star:hover{color:var(--kin)}.fmeta .star:hover{transform:scale(1.2)}.fmeta .sep{width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 8px}
#focus .seek{width:min(460px,90vw);flex:none}#focus .ctl{gap:8px}#focus .ctl button{font-size:22px;width:52px;height:52px}#focus .ctl .play{width:64px;height:64px;font-size:26px}#focus .ctl .opt{font-size:20px}#focus .vrow{display:flex;align-items:center;gap:6px;width:min(220px,70vw)}#focus .vrow .vol{flex:1;min-width:0}
#focus .fnext{font-size:13px;opacity:.55;min-height:1.4em;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#focus .keys{font-size:12px;opacity:.45}
#focus .cl{position:fixed;z-index:2;right:16px;top:calc(16px + env(safe-area-inset-top,0px));color:#f6efe3;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 14px;background:rgba(23,23,38,.35);backdrop-filter:blur(6px);transition:background .15s}#focus .cl:hover{background:rgba(255,255,255,.14)}
@media (max-width:860px){#focus{--deck:min(64vw,38vh,380px)}}
#focus.lyr{--deck:min(30vmin,22vh,240px)}
#focus .lyr{display:none;width:min(520px,92vw);height:clamp(120px,24vh,210px);overflow-y:auto;position:relative;text-align:center;padding:48px 8px;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
#focus.lyr .lyr{display:block}
.lyr::-webkit-scrollbar{display:none}
.lyr .ln{padding:5px 10px;font:500 17px/1.45 var(--bd);opacity:.4;transition:opacity .25s,transform .25s,color .25s}
.lyr .ln.sync{cursor:pointer}.lyr .ln.sync:hover{opacity:.7}
.lyr .ln.on{opacity:1;font-weight:700;color:var(--sak);transform:scale(1.05)}
.lyr.plain .ln{opacity:.85}
.lyr .nol{padding:30px 0;opacity:.65;font-size:14px;line-height:2}
.lyr .nol .btn{background:rgba(255,255,255,.1);color:#f6efe3;border-color:rgba(255,255,255,.25)}

<script>

/* ---------- Data ---------- */

function seeds(){const g=[{id:'g1',name:'Santai'},{id:'g2',name:'Fokus'},{id:'g3',name:'Malam'}];
const T=[['Sakura Fubuki','Haruka','g1','lofi,musim semi',5,'桜'],['Koto no Yume','Aoi','g2','koto,tradisional',4,'琴'],['Tsuki no Michi','Reina','g3','malam,tenang',5,'月'],['Kyoto Rain','Haruka','g1','hujan,lofi',4,'雨'],['Fuji Sunrise','Daichi','g2','pagi,epik',3,'富'],['Matcha Break','Sora','g1','kafe,santai',4,'茶'],['Neon Shibuya','Kenji','g3','kota,synth',3,'渋'],['Hanabi','Mio','g1','musim panas,festival',5,'花'],['Zen Garden','Aoi','g2','meditasi,koto',4,'禅'],['Yozakura','Reina','g3','malam,sakura',4,'夜']];
return{g,t:T.map((r,i)=>({id:'s'+i,title:r[0],artist:r[1],group:r[2],tags:r[3].split(','),rating:r[4],fav:i%4===0,thumb:'',kanji:r[5],kind:'synth',src:'',seed:101+i*37,added:Date.now()-i*1000,lyrics:i===0?SAMPLE_LRC:''}))}}

let S=load();const blobs={},U={q:'',page:1,group:'all',tag:'',sel:new Set(),queue:[],ids:[]};
function save(){try{idbGC()}catch(e){}try{const ok=new Set(S.tracks.map(t=>t.id));(S.playlists||[]).forEach(p=>p.ids=p.ids.filter(i=>ok.has(i)))}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Penyimpanan penuh. Buat backup lalu hapus thumbnail besar.')}}
function toast(m){const e=document.createElement('div');e.className='tst';e.textContent=m;$('#toast').appendChild(e);setTimeout(()=>e.remove(),2800)}
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};

/* ---------- Audio engine (file/URL + nada koto sintetis) ---------- */
const A=document.createElement('video'),P={id:null,playing:false,ctx:null,pos:0,off:0,t0:0,tm:null,dur:90,notes:[],ni:0,vol:.8};A.volume=P.vol;if(typeof S.ui.vol==='number'){P.vol=S.ui.vol;A.volume=P.vol}let drag=false;const H=[];

const vIcon=()=>P.vol===0?'🔇':P.vol<.5?'🔉':'🔊';
function syncVol(){$$('.vol').forEach(e=>{e.value=P.vol*100;e.style.setProperty('--p',P.vol*100+'%')});$$('.mb').forEach(e=>{e.textContent=vIcon();e.setAttribute('aria-label',P.vol===0?'Aktifkan suara':'Bisukan')})}

function genNotes(seed){let s=seed;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296,sc=[0,1,5,7,8],base=196*Math.pow(2,(seed%5)/12);let t=0,i=3,o=[];
while(t<90){i=Math.max(0,Math.min(14,i+Math.floor(r()*5)-2));const d=[.5,.5,1,1.5][Math.floor(r()*4)];if(r()>.12)o.push({t,f:base*Math.pow(2,(sc[i%5]+12*Math.floor(i/5))/12),d});t+=d*.9}return o}
function pluck(n,w){const c=P.ctx;w=Math.max(w,c.currentTime);[[1,.3],[2,.08]].forEach(([m,v])=>{const o=c.createOscillator(),g=c.createGain();o.type=m===1?'triangle':'sine';o.frequency.value=n.f*m;g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(v*P.vol,w+.01);g.gain.exponentialRampToValueAtTime(.001,w+1.8);o.connect(g).connect(c.destination);o.start(w);o.stop(w+1.9)})}
function tick(){const c=P.ctx;P.pos=P.off+(c.currentTime-P.t0);if(P.pos>=P.dur){ended();return}
while(P.ni<P.notes.length&&P.notes[P.ni].t<P.pos+.25){const n=P.notes[P.ni++];pluck(n,P.t0-P.off+n.t)}}
function startSynth(pos){P.ctx=P.ctx||new(window.AudioContext||window.webkitAudioContext)();P.ctx.resume();P.off=pos;P.t0=P.ctx.currentTime;P.ni=P.notes.findIndex(n=>n.t>=pos);if(P.ni<0)P.ni=P.notes.length;clearInterval(P.tm);P.tm=setInterval(tick,80)}
const cur=()=>S.tracks.find(t=>t.id===P.id);
function halt(){clearInterval(P.tm);A.pause()}
function setLoad(v){const e=$('#player');if(e)e.classList.toggle('ld',!!v)}
['waiting','stalled','loadstart'].forEach(n=>A.addEventListener(n,()=>{if(P.playing)setLoad(true)}));['playing','canplay','pause','error'].forEach(n=>A.addEventListener(n,()=>setLoad(false)));

function play(id){const t=S.tracks.find(x=>x.id===id);if(!t)return;

renderPlayer()}
function toggle(){if(!P.id){const f=filtered();if(!f.length)return toast('Belum ada lagu untuk diputar.');U.queue=f.map(t=>t.id);return play(f[0].id)}

const qIds=()=>(U.queue.length?U.queue:S.tracks.map(t=>t.id)).filter(id=>S.tracks.some(t=>t.id===id));
function go(d,auto){const q=qIds();if(!q.length)return;const i=q.indexOf(P.id);
if(d<0&&!auto){if(pos()>3){seek(0);prog();return}if(S.ui.shuf&&H.length)return play(H.pop())}
let n;if(S.ui.shuf&&q.length>1){do{n=Math.floor(Math.random()*q.length)}while(n===i)}else n=(i+d+q.length)%q.length;

function renderSide(){const cnt=g=>S.tracks.filter(t=>t.group===g).length,tags={};S.tracks.forEach(t=>t.tags.forEach(x=>tags[x]=(tags[x]||0)+1));

<p><b>1. Dari internet (domain)</b><br>Tempel tautan <u>langsung ke berkas</u> audio, berakhiran <code>.mp3</code>, <code>.flac</code>, <code>.ogg</code>, <code>.wav</code>, atau <code>.m4a</code>.<br>Contoh: <code>https://contoh.com/musik/film.mp3</code></p>
<p><b>2. Dari penyimpanan lokal (komputer)</b><br>Awali dengan <code>file:///</code> lalu jalur berkas, memakai garis miring <code>/</code>.<br>Windows: <code>file:///C:/Musik/lagu.mp3</code><br>Mac: <code>file:///Users/nama/Music/lagu.flac</code><br>Linux: <code>file:///home/nama/Musik/lagu.mp3</code><br>Spasi ditulis <code>%20</code>, misalnya <code>file:///C:/Musik/lagu%20baru.mp3</code>.</p>
<p><b>Catatan</b></p>
<ul>
<li>Tautan <code>file:///</code> hanya berfungsi jika halaman pemutar ini juga dibuka dari komputer (alamat diawali <code>file://</code>). Jika dibuka lewat <code>https://</code>, browser akan memblokirnya. Gunakan kolom <i>pilih file audio</i> sebagai gantinya.</li>
<li>Tautan <code>http://</code> (tanpa s) bisa diblokir bila halaman dibuka lewat <code>https://</code>. Pakai <code>https://</code>.</li>
<li>Halaman pratinjau (YouTube, Google Drive, Spotify, dll.) tidak bisa dipakai, harus tautan langsung ke berkas audio.</li>
<li>Dukungan format bergantung pada browser. MP3 paling aman, FLAC didukung browser modern.</li>
<li>Tips: seret berkas musik ke tab browser baru, lalu salin alamat di bilah alamat.</li>
<li>File dari <i>pilih file audio</i> atau seret &amp; lepas disimpan di penyimpanan browser (IndexedDB), jadi tetap bisa diputar setelah halaman dimuat ulang. Jika browser menolak menyimpannya, file perlu dipilih ulang.</li>
<li>Kosongkan kedua kolom untuk memakai nada koto demo.</li>
</ul></div></details>
